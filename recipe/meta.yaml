{% set python_min = "3.12" %}
{% set name = "robotframework-appiumlibrary" %}
{% set version = "3.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: bd49f7b85a3a39e97637bce68af3c2ac6a98fc0fb45bd39de9a8042cadefe4c4

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest-runner
    - python {{ python_min }}
    - setuptools
  run:
    - appium-python-client >=2.7.1,<4.0.0
    - decorator >=3.3.2
    - docutils >=0.8.1
    - kitchen >=1.2.4
    - python >={{ python_min }}
    - robotframework >=2.6.0
    - selenium >=4.0,<=4.16
    - six >=1.10.0

test:
  imports:
    - AppiumLibrary
    - AppiumLibrary.keywords
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/serhatbolsu/robotframework-appiumlibrary
  summary: Robot Framework Mobile app testing library for Appium Client Android & iOS & Web
  license: Apache-2.0
  license_file: LICENSE.txt
extra:
  recipe-maintainers:
    - saibhargav1508
    - nisharai1
